<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tortiland</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #fff;
    }

    #ui {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
    }

    #ui span {
      color: #7df9ff;
    }

    #timerDisplay {
      color: #ffd700;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }

    #canvas-container {
      position: relative;
      border: 3px solid #7df9ff;
      box-shadow: 0 0 20px #7df9ff55;
    }

    canvas {
      display: block;
      cursor: pointer;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: #7df9ff;
      text-shadow: 0 0 10px #7df9ff;
      gap: 16px;
    }

    #overlay.hidden {
      display: none;
    }

    #overlay button {
      margin-top: 10px;
      padding: 10px 30px;
      font-size: 20px;
      font-family: 'Courier New', monospace;
      background: #7df9ff;
      color: #1a1a2e;
      border: none;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      transition: background 0.2s;
    }

    #overlay button:hover {
      background: #a8ffff;
    }

    #hint {
      margin-top: 8px;
      font-size: 13px;
      color: #aaa;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <div id="ui">
    <div>1p: <span id="scoreDisplay">0</span></div>
    <div>🌿: <span id="collectiblesDisplay">0</span></div>
    <div id="applesProgress">🍎 Manzanas: <span id="applesDisplay">🍎 🍎 🍎 🍎 🍎</span></div>
    <div>❤️ <span id="livesDisplay">3</span></div>
    <div>LVL <span id="levelDisplay">1</span></div>
    <div>⏱️ <span id="timerDisplay">00:00</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <div id="overlayTitle">🐢 TORTILAND 🐢</div>
      <div id="overlayMsg" style="font-size:16px; color:#fff;">Recoge hierbas, brócolis, coles y vegetales. Usa el pasto
        para protegerte.</div>
      <button id="overlayBtn">▶ JUGAR</button>
      <div id="hint">WASD / Flechas = Mover &nbsp;|&nbsp; Espacio = Pasto</div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONSTANTES Y CONFIGURACIÓN GLOBAL
    // ============================================================
    const COLS = 20, ROWS = 15;
    const TILE = 40;
    const W = COLS * TILE, H = ROWS * TILE;

    const canvas = document.getElementById('gameCanvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    // Tipos de tile
    const T_EMPTY = 0, T_WALL = 1, T_ICE = 2;

    // ============================================================
    // MAPA BASE — paredes interiores fijas (laberinto tipo arcade)
    // ============================================================
    function buildBaseMap() {
      const m = [];
      for (let r = 0; r < ROWS; r++) {
        m.push([]);
        for (let c = 0; c < COLS; c++) {
          // Bordes exteriores siempre son paredes
          if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) {
            m[r].push(T_WALL);
          } else {
            m[r].push(T_EMPTY);
          }
        }
      }
      // Paredes interiores (diseño fijo estilo Tortiland)
      const innerWalls = [
        [2, 2], [2, 3], [2, 4],
        [2, 7], [2, 8], [2, 9], [2, 10], [2, 11], [2, 12],
        [4, 2], [5, 2], [6, 2],
        [4, 5], [4, 6], [4, 7],
        [4, 12], [4, 13], [4, 14], [4, 15], [4, 16],
        [6, 5], [7, 5], [8, 5],
        [6, 10], [6, 11], [6, 12],
        [7, 8], [8, 8], [9, 8],
        [7, 15], [8, 15], [9, 15], [10, 15],
        [10, 3], [10, 4], [10, 5], [10, 6],
        [10, 10], [10, 11], [10, 12],
        [12, 2], [12, 3], [12, 4],
        [12, 7], [12, 8], [12, 9],
        [12, 12], [12, 13], [12, 14], [12, 15], [12, 16],
        [3, 17], [4, 17], [5, 17],
        [7, 17], [7, 18],
        [9, 1], [9, 2], [9, 3],
        [11, 1], [11, 2],
        [13, 5], [13, 6], [13, 7],
        [13, 10], [13, 11],
      ];
      innerWalls.forEach(([r, c]) => {
        if (r > 0 && r < ROWS - 1 && c > 0 && c < COLS - 1) m[r][c] = T_WALL;
      });
      return m;
    }

    // ============================================================
    // ESTADO DEL JUEGO
    // ============================================================
    let map, player, enemies, fruits;
    let score = 0, lives = 3, level = 1;
    let gameState = 'menu'; // 'menu' | 'playing' | 'dead' | 'gameover' | 'win'
    let deathTimer = 0;
    let levelPhase = 'apples'; // 'apples' | 'oranges'
    let gameTimeElapsed = 0;
    let isPaused = false;

    // ============================================================
    // INICIALIZACIÓN DEL NIVEL
    // ============================================================
    function initLevel() {
      gameTimeElapsed = 0;
      isPaused = false;
      map = buildBaseMap();

      // Bloques de hielo iniciales (6-8 distribuidos)
      const icePositions = [
        [3, 5], [3, 15], [5, 9], [7, 3], [7, 13], [9, 7], [11, 11], [13, 17]
      ];
      icePositions.forEach(([r, c]) => {
        if (map[r][c] === T_EMPTY) map[r][c] = T_ICE;
      });

      // Jugador — empieza en esquina libre
      player = {
        col: 1, row: 1,           // posición grid
        x: 1 * TILE + TILE / 2,    // posición pixel (centro)
        y: 1 * TILE + TILE / 2,
        targetCol: 1, targetRow: 1,
        moving: false,
        dir: { x: 1, y: 0 },     // dirección que "mira"
        speed: 2,                  // caminar un poco más lento (antes 3)
        animFrame: 0,
        animTimer: 0,
        invincible: 0,            // frames de invencibilidad tras morir
        goldenBroccoliTimer: 0,   // tiempo restante de atravesar pasto
        powerCooldown: 0,         // cooldown para crear y romper a un ritmo más pausado
      };

      // Manzanas iniciales (5)
      fruits = [];
      levelPhase = 'apples';
      for (let i = 0; i < 5; i++) spawnFruit(3);
      checkGoldenBroccoliSpawn();

      // Enemigos
      enemies = [
        // Tipo 1: patrullero lento (×2)
        makeEnemy('patrol', 18, 13, 0, 1),
        makeEnemy('patrol', 18, 1, 1, 0),
        // Tipo 2: perseguidor rápido (×1)
        makeEnemy('chaser', 10, 13, -1, 0),
        // Tipo 3: fantasma — atraviesa hielo, es lento (×1)
        makeEnemy('ghost', 1, 13, 0, -1),
      ];
    }

    function makeEnemy(type, col, row, dx, dy) {
      // En el primer nivel la velocidad se reduce para que sigan al jugador lentamente
      const speedMap = {
        patrol: level === 1 ? 0.75 : 1.5,
        chaser: level === 1 ? 1.1 : 2.5,
        ghost: level === 1 ? 0.65 : 1.2
      };
      const spd = speedMap[type];
      return {
        type, col, row,
        x: col * TILE + TILE / 2,
        y: row * TILE + TILE / 2,
        targetCol: col, targetRow: row,
        moving: false,
        dir: { x: dx, y: dy },
        speed: spd,
        chaseTimer: 1,  // iniciar en 1 para que el primer frame ya calcule dirección
        animFrame: 0, animTimer: 0,
      };
    }

    // ============================================================
    // FORMATO DE TIEMPO
    // ============================================================
    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    // ============================================================
    // UTILIDADES DE MAPA
    // ============================================================
    function isWall(col, row) {
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return true;
      return map[row][col] === T_WALL;
    }
    function isIce(col, row) {
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return false;
      return map[row][col] === T_ICE;
    }
    function isSolid(col, row, ghostMode, isPlayer) {
      // isPlayer=true: aplica el buff del Brócoli Dorado. Enemigos nunca lo pasan.
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return true;
      if (map[row][col] === T_WALL) return true;
      if (map[row][col] === T_ICE) {
        if (ghostMode) return false;                                      // ghost atraviesa pasto
        if (isPlayer && player && player.goldenBroccoliTimer > 0) return false; // buff exclusivo
        return true;
      }
      return false;
    }
    function isEmpty(col, row) {
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return false;
      return map[row][col] === T_EMPTY;
    }

    // Devuelve posición vacía aleatoria (no sobre paredes, arbustos, player, vegetales)
    function randomEmptyCell() {
      let tries = 0;
      while (tries++ < 500) {
        const c = 1 + Math.floor(Math.random() * (COLS - 2));
        const r = 1 + Math.floor(Math.random() * (ROWS - 2));
        if (map[r][c] !== T_EMPTY) continue;
        if (c === player.col && r === player.row) continue;
        if (fruits.some(f => f.col === c && f.row === r)) continue;
        return { col: c, row: r };
      }
      return null;
    }

    function spawnFruit(type) {
      const pos = randomEmptyCell();
      if (pos) {
        fruits.push({
          col: pos.col, row: pos.row,
          type: type, // tipo de fruta específico (3: manzana, 4: naranja)
          anim: Math.random() * Math.PI * 2,   // offset animación
        });
      }
    }

    function checkGoldenBroccoliSpawn() {
      // El brócoli dorado solo debe aparecer cuando el jugador tenga exactamente una vida disponible
      if (lives === 1) {
        const hasGoldenBroccoli = fruits.some(f => f.type === 5);
        if (!hasGoldenBroccoli) {
          spawnFruit(5);
        }
      } else {
        // Quitar el brócoli dorado si tiene más de una vida
        fruits = fruits.filter(f => f.type !== 5);
      }
    }

    // ============================================================
    // INPUT — teclado con bloqueo de diagonales
    // ============================================================
    const keys = {};
    let lastDir = null;  // primera dirección presionada (bloqueo diagonal)

    document.addEventListener('keydown', e => {
      const prev = keys[e.code];
      keys[e.code] = true;

      // Bloqueo diagonal: solo registrar si no hay ya una dirección activa
      if (!prev) {
        if (['ArrowUp', 'KeyW'].includes(e.code) && !hasMoveKey('v'))
          lastDir = { x: 0, y: -1 };
        else if (['ArrowDown', 'KeyS'].includes(e.code) && !hasMoveKey('v'))
          lastDir = { x: 0, y: 1 };
        else if (['ArrowLeft', 'KeyA'].includes(e.code) && !hasMoveKey('h'))
          lastDir = { x: -1, y: 0 };
        else if (['ArrowRight', 'KeyD'].includes(e.code) && !hasMoveKey('h'))
          lastDir = { x: 1, y: 0 };
      }

      // Crear pasto (Espacio)
      if (e.code === 'Space' && gameState === 'playing') {
        e.preventDefault();
        useIcePower('create');
      }
      // Quitar pasto (Tab)
      if (e.code === 'Tab' && gameState === 'playing') {
        e.preventDefault();
        useIcePower('break');
      }
      if ((e.code === 'Space' || e.code === 'Tab') && gameState !== 'playing') e.preventDefault();
    });
    document.addEventListener('keyup', e => {
      keys[e.code] = false;
      // Al soltar, recalcular lastDir con las teclas aún presionadas
      lastDir = null;
      if (keys['ArrowUp'] || keys['KeyW']) lastDir = { x: 0, y: -1 };
      else if (keys['ArrowDown'] || keys['KeyS']) lastDir = { x: 0, y: 1 };
      else if (keys['ArrowLeft'] || keys['KeyA']) lastDir = { x: -1, y: 0 };
      else if (keys['ArrowRight'] || keys['KeyD']) lastDir = { x: 1, y: 0 };
    });

    function hasMoveKey(axis) {
      if (axis === 'v') return keys['ArrowUp'] || keys['KeyW'] || keys['ArrowDown'] || keys['KeyS'];
      return keys['ArrowLeft'] || keys['KeyA'] || keys['ArrowRight'] || keys['KeyD'];
    }

    // ============================================================
    // MECÁNICA DE HIELO — Crear o destruir delante del jugador
    // ============================================================
    function useIcePower(action) {
      if (player.powerCooldown > 0) return;
      if (player.moving) return; // Bloquear uso del poder mientras el jugador está en movimiento (evita bugs de colisión)

      const dir = player.dir;
      const powerCount = Math.min(4, Math.max(1, Math.floor(score / 2) + 1)); // máx 4 celdas

      const firstCc = player.col + dir.x;
      const firstCr = player.row + dir.y;

      if (firstCc <= 0 || firstCc >= COLS - 1 || firstCr <= 0 || firstCr >= ROWS - 1) return;
      if (isWall(firstCc, firstCr)) return;

      let currentCc = firstCc;
      let currentCr = firstCr;
      let actionExecuted = false;

      if (action === 'break') {
        // ROMPER: únicamente bloques continuos de pasto
        for (let i = 0; i < powerCount; i++) {
          if (currentCc <= 0 || currentCc >= COLS - 1 || currentCr <= 0 || currentCr >= ROWS - 1) break;
          if (isWall(currentCc, currentCr)) break;

          if (isIce(currentCc, currentCr)) {
            map[currentCr][currentCc] = T_EMPTY;
            actionExecuted = true;
          } else {
            // Si encuentra un espacio vacío o cualquier otra cosa, se detiene la eliminación
            break;
          }
          currentCc += dir.x;
          currentCr += dir.y;
        }
      } else if (action === 'create') {
        // CREAR: se limita hasta chocar con otro bloque u obstáculo (pared, hielo, jugador, enemigo)
        for (let i = 0; i < powerCount; i++) {
          if (currentCc <= 0 || currentCc >= COLS - 1 || currentCr <= 0 || currentCr >= ROWS - 1) break;

          // Se comprueba tanto la celda actual como la de destino (para evitar atravesar bloques al moverse)
          const hasPlayer = (player.col === currentCc && player.row === currentCr) ||
            (player.targetCol === currentCc && player.targetRow === currentCr);
          const hasEnemy = enemies.some(e => e.col === currentCc && e.row === currentCr);

          // Si choca con un obstáculo, detiene la creación inmediatamente
          if (isWall(currentCc, currentCr) || isIce(currentCc, currentCr) || hasPlayer || hasEnemy) {
            break;
          }

          if (isEmpty(currentCc, currentCr)) {
            map[currentCr][currentCc] = T_ICE;
            actionExecuted = true;
          }

          currentCc += dir.x;
          currentCr += dir.y;
        }
      }

      if (actionExecuted) {
        player.powerCooldown = 50; // Ritmo aún más pausado: cooldown de 50 frames (0.83s)
      }
    }

    // ============================================================
    // MOVIMIENTO DEL JUGADOR (grid-locked con interpolación suave)
    // ============================================================
    function updatePlayer(dt) {
      if (player.invincible > 0) player.invincible--;
      if (player.goldenBroccoliTimer > 0) player.goldenBroccoliTimer--;
      if (player.powerCooldown > 0) player.powerCooldown--;

      // Si el jugador ya llegó a la celda destino, puede recibir nueva dirección
      if (!player.moving) {
        let dir = lastDir;
        if (!dir) {
          // Leer dirección actual de teclas
          if (keys['ArrowUp'] || keys['KeyW']) dir = { x: 0, y: -1 };
          else if (keys['ArrowDown'] || keys['KeyS']) dir = { x: 0, y: 1 };
          else if (keys['ArrowLeft'] || keys['KeyA']) dir = { x: -1, y: 0 };
          else if (keys['ArrowRight'] || keys['KeyD']) dir = { x: 1, y: 0 };
        }
        if (dir) {
          player.dir = dir; // actualizar dirección visual aunque no pueda moverse
          const nc = player.col + dir.x;
          const nr = player.row + dir.y;
          if (!isSolid(nc, nr, false, true)) {  // true = es el jugador
            player.targetCol = nc;
            player.targetRow = nr;
            player.moving = true;
          }
        }
      }

      // Interpolación suave hacia la celda destino
      if (player.moving) {
        const tx = player.targetCol * TILE + TILE / 2;
        const ty = player.targetRow * TILE + TILE / 2;
        const dx = tx - player.x;
        const dy = ty - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist <= player.speed) {
          // Llegó a destino
          player.x = tx; player.y = ty;
          player.col = player.targetCol;
          player.row = player.targetRow;
          player.moving = false;

          // Recoger fruta si hay una en esta celda
          checkFruitPickup();
        } else {
          player.x += (dx / dist) * player.speed;
          player.y += (dy / dist) * player.speed;
        }
      }

      // Animación del sprite
      player.animTimer++;
      if (player.animTimer > 8) { player.animTimer = 0; player.animFrame = (player.animFrame + 1) % 4; }
    }

    function checkFruitPickup() {
      const idx = fruits.findIndex(f => f.col === player.col && f.row === player.row);
      if (idx !== -1) {
        const pickedType = fruits[idx].type;
        fruits.splice(idx, 1);

        if (pickedType === 5) {
          // ¡Consumió un Brócoli Dorado!
          player.goldenBroccoliTimer = 600; // 10 segundos
          spawnParticles(player.col, player.row, '#ffd700');
        } else {
          // Fruta de fase regular
          score++;
          updateUI();
        }

        // Comprobar si se consumieron todas los vegetales de la fase actual (ignorando brócolis dorados sobrantes)
        const targetFruitsCount = fruits.filter(f => f.type === (levelPhase === 'apples' ? 3 : 4)).length;
        if (targetFruitsCount === 0) {
          if (levelPhase === 'apples') {
            // Transición a la fase de naranjas
            levelPhase = 'oranges';
            // Eliminar brócoli dorado sobrante de la fase anterior
            fruits = fruits.filter(f => f.type !== 5);
            // Spawnear naranjas y brócoli dorado si cumple condición de vida
            for (let i = 0; i < 5; i++) spawnFruit(4);
            checkGoldenBroccoliSpawn();
            updateUI(); // Actualizar interfaz para mostrar la fase de naranjas
          } else if (levelPhase === 'oranges') {
            // ¡Se comió todas las naranjas! Ganaste el nivel 1
            gameState = 'win';
            const finalTime = formatTime(gameTimeElapsed);
            showOverlay('🏆 ¡NIVEL COMPLETADO!', `¡Felicidades! Recogiste todas las frutas (${score} total) para un total de ${score * 100} puntos en ${finalTime}.`, 'Jugar de nuevo');
          }
        }
      }
    }

    // ============================================================
    // IA DE ENEMIGOS
    // ============================================================

    // Dirección perpendicular aleatoria (para patrullero al chocar)
    function perpDir(dir) {
      if (dir.x !== 0) return Math.random() < 0.5 ? { x: 0, y: 1 } : { x: 0, y: -1 };
      return Math.random() < 0.5 ? { x: 1, y: 0 } : { x: -1, y: 0 };
    }

    function updateEnemy(e) {
      if (!e.moving) {
        // BFS se ejecuta cada vez que el enemigo termina un paso (cuando llega a una celda).
        // El chaseTimer limita cuán seguido se recalcula para no sobrecargar en casos donde
        // el jugador se mueve muy rápido: patrol recalcula cada ~3 celdas, chaser cada 1-2.
        const ghost = e.type === 'ghost';

        e.chaseTimer--;
        let newDir;

        if (e.chaseTimer <= 0) {
          // Recalcular ruta óptima con BFS
          newDir = chaseDir(e, ghost);
          // Intervalo de recálculo según tipo:
          // patrol: más pausado (simula enemigo menos inteligente)
          // chaser: muy frecuente (perseguidor reactivo)
          // ghost: frecuencia media
          if (e.type === 'patrol') e.chaseTimer = 3 + Math.floor(Math.random() * 3);
          else if (e.type === 'chaser') e.chaseTimer = 1;
          else e.chaseTimer = 2;
        } else {
          // Mantener dirección previamente calculada mientras el timer no expire
          newDir = e.dir;
        }

        // Validar que la dirección elegida sea transitable; si no, forzar BFS ahora
        const nc0 = e.col + newDir.x, nr0 = e.row + newDir.y;
        if (isSolid(nc0, nr0, ghost)) {
          newDir = chaseDir(e, ghost);
          e.chaseTimer = 1; // forzar nuevo recálculo pronto
        }

        e.dir = newDir;
        const nc = e.col + newDir.x, nr = e.row + newDir.y;
        if (!isSolid(nc, nr, ghost)) {
          e.targetCol = nc; e.targetRow = nr;
          e.moving = true;
        }
      }

      // Interpolación suave del enemigo
      if (e.moving) {
        const tx = e.targetCol * TILE + TILE / 2;
        const ty = e.targetRow * TILE + TILE / 2;
        const dx = tx - e.x, dy = ty - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist <= e.speed) {
          e.x = tx; e.y = ty;
          e.col = e.targetCol; e.row = e.targetRow;
          e.moving = false;
        } else {
          e.x += (dx / dist) * e.speed;
          e.y += (dy / dist) * e.speed;
        }
      }

      // Animación
      e.animTimer++;
      if (e.animTimer > 10) { e.animTimer = 0; e.animFrame = (e.animFrame + 1) % 4; }
    }

    // Determina la mejor dirección para perseguir al jugador
    // BFS: encuentra el camino más corto real desde el enemigo hasta el jugador,
    // respetando paredes y (según ghostMode) bloques de pasto.
    // Devuelve el primer paso de ese camino como dirección {x, y}.
    function chaseDir(e, ghostMode) {
      const startC = e.col, startR = e.row;
      const goalC = player.col, goalR = player.row;

      if (startC === goalC && startR === goalR) return e.dir;

      const DIRS = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
      // visited[r][c] guarda { fromC, fromR } para reconstruir el camino
      const visited = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
      visited[startR][startC] = { fromC: -1, fromR: -1 };

      const queue = [{ c: startC, r: startR }];
      let found = false;

      bfsLoop: while (queue.length > 0) {
        const { c, r } = queue.shift();
        for (const d of DIRS) {
          const nc = c + d.x, nr = r + d.y;
          if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
          if (visited[nr][nc] !== null) continue;
          if (isSolid(nc, nr, ghostMode)) continue;
          visited[nr][nc] = { fromC: c, fromR: r };
          if (nc === goalC && nr === goalR) { found = true; break bfsLoop; }
          queue.push({ c: nc, r: nr });
        }
      }

      if (!found) {
        // Sin camino accesible: fallback greedy de un paso
        const fallback = DIRS.filter(d => !isSolid(e.col + d.x, e.row + d.y, ghostMode));
        fallback.sort((a, b) => {
          const da = Math.abs((e.col + a.x) - goalC) + Math.abs((e.row + a.y) - goalR);
          const db = Math.abs((e.col + b.x) - goalC) + Math.abs((e.row + b.y) - goalR);
          return da - db;
        });
        return fallback[0] || e.dir;
      }

      // Reconstruir hacia atrás para encontrar el primer paso desde el origen
      let c = goalC, r = goalR;
      while (true) {
        const prev = visited[r][c];
        if (prev.fromC === startC && prev.fromR === startR) {
          return { x: c - startC, y: r - startR };
        }
        c = prev.fromC;
        r = prev.fromR;
      }
    }

    // ============================================================
    // DETECCIÓN DE COLISIÓN JUGADOR-ENEMIGO
    // ============================================================
    function checkPlayerEnemyCollision() {
      if (player.invincible > 0) return;
      for (const e of enemies) {
        // Colisión por distancia en píxeles (más precisa que por tile)
        const dx = player.x - e.x, dy = player.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < TILE * 0.7) {
          // Jugador tocó enemigo
          lives--;
          updateUI();
          if (lives <= 0) {
            gameState = 'gameover';
            const finalTime = formatTime(gameTimeElapsed);
            showOverlay('💀 GAME OVER', `Coleccionables: ${score} | Puntos: ${score * 100} | Tiempo: ${finalTime}`, 'Reiniciar');
          } else {
            // Reaparecer jugador y enemigos (mantener vegetales e arbustos)
            player.invincible = 120; // 2 segundos de invencibilidad
            respawnEntities();
            checkGoldenBroccoliSpawn();
          }
          return;
        }
      }
    }

    function respawnEntities() {
      player.col = 1; player.row = 1;
      player.x = 1 * TILE + TILE / 2; player.y = 1 * TILE + TILE / 2;
      player.targetCol = 1; player.targetRow = 1;
      player.moving = false;

      enemies[0].col = 18; enemies[0].row = 13; enemies[0].x = 18 * TILE + TILE / 2; enemies[0].y = 13 * TILE + TILE / 2;
      enemies[1].col = 18; enemies[1].row = 1; enemies[1].x = 18 * TILE + TILE / 2; enemies[1].y = 1 * TILE + TILE / 2;
      enemies[2].col = 10; enemies[2].row = 7; enemies[2].x = 10 * TILE + TILE / 2; enemies[2].y = 7 * TILE + TILE / 2;
      enemies[3].col = 1; enemies[3].row = 13; enemies[3].x = 1 * TILE + TILE / 2; enemies[3].y = 13 * TILE + TILE / 2;
      enemies.forEach(e => { e.moving = false; e.chaseTimer = 1; });
    }

    // ============================================================
    // RENDERIZADO
    // ============================================================

    // Colores del mapa
    const COLORS = {
      floor: '#c8f0ff',
      floorAlt: '#b8e8f8',
      wall: '#2255aa',
      wallEdge: '#1a3d80',
      wallTop: '#4488dd',
      ice: '#a0e8ff',
      iceEdge: '#60c8ee',
      iceShine: '#ffffff',
      bg: '#1a3a5c',
    };

    // Paleta e información de coleccionables (Hierbas, Hojas, Flores y Frutas)
    const COLLECTIBLE_NAMES = [
      'Hierba Silvestre',
      'Brócoli Fresco',
      'Col Crujiente',
      'Manzana Roja',
      'Naranja Dulce'
    ];

    function drawMap() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = c * TILE, y = r * TILE;
          const t = map[r][c];

          if (t === T_WALL) {
            // Muro exterior / Seto florido denso (indestructible)
            ctx.fillStyle = '#1b4332'; // Base seto verde oscuro
            ctx.fillRect(x, y, TILE, TILE);

            // Borde de seto tridimensional
            ctx.strokeStyle = '#081c15';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);

            // Patrón de hojas/curvas en el seto
            ctx.fillStyle = '#2d6a4f';
            ctx.beginPath();
            ctx.arc(x + 12, y + 14, 8, 0, Math.PI * 2);
            ctx.arc(x + 28, y + 16, 9, 0, Math.PI * 2);
            ctx.arc(x + 20, y + 28, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#40916c'; // Iluminación media de hojas
            ctx.beginPath();
            ctx.arc(x + 10, y + 12, 5, 0, Math.PI * 2);
            ctx.arc(x + 26, y + 14, 6, 0, Math.PI * 2);
            ctx.arc(x + 18, y + 25, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#52b788'; // Hojas más iluminadas
            ctx.beginPath();
            ctx.arc(x + 8, y + 10, 3, 0, Math.PI * 2);
            ctx.arc(x + 24, y + 12, 3, 0, Math.PI * 2);
            ctx.arc(x + 16, y + 23, 4, 0, Math.PI * 2);
            ctx.fill();

            // Algunas flores silvestres pequeñas dispersas (según coordenadas)
            if ((r + c) % 3 === 0) {
              ctx.fillStyle = '#ff85a1'; // Flores rosas
              ctx.beginPath();
              ctx.arc(x + 15, y + 18, 3, 0, Math.PI * 2);
              ctx.arc(x + 23, y + 20, 2.5, 0, Math.PI * 2);
              ctx.fill();
              // Centro amarillo
              ctx.fillStyle = '#ffd54f';
              ctx.beginPath();
              ctx.arc(x + 15, y + 18, 1, 0, Math.PI * 2);
              ctx.arc(x + 23, y + 20, 0.8, 0, Math.PI * 2);
              ctx.fill();
            }
          } else if (t === T_ICE) {
            // Bloque de pasto / hierba denso
            ctx.fillStyle = '#4caf50'; // Pasto base
            ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);

            // Borde exterior
            ctx.strokeStyle = '#2e7d32';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);

            // Pequeñas ramitas/cuchillas de hierba (detalles de pasto)
            ctx.fillStyle = '#81c784'; // Verde claro para relieve
            ctx.beginPath();
            ctx.moveTo(x + 8, y + 16); ctx.lineTo(x + 5, y + 6); ctx.lineTo(x + 10, y + 16);
            ctx.moveTo(x + 10, y + 16); ctx.lineTo(x + 10, y + 4); ctx.lineTo(x + 13, y + 16);
            ctx.moveTo(x + 13, y + 16); ctx.lineTo(x + 15, y + 8); ctx.lineTo(x + 17, y + 16);
            ctx.fill();

            // Grupo de hierbas inferior derecha
            ctx.fillStyle = '#388e3c'; // Verde medio oscuro
            ctx.beginPath();
            ctx.moveTo(x + 23, y + 32); ctx.lineTo(x + 20, y + 22); ctx.lineTo(x + 25, y + 32);
            ctx.moveTo(x + 25, y + 32); ctx.lineTo(x + 26, y + 20); ctx.lineTo(x + 29, y + 32);
            ctx.moveTo(x + 29, y + 32); ctx.lineTo(x + 32, y + 24); ctx.lineTo(x + 34, y + 32);
            ctx.fill();

            // Un par de hojitas dispersas
            ctx.fillStyle = '#c8e6c9'; // Muy claro
            ctx.fillRect(x + 28, y + 8, 3, 3);
            ctx.fillRect(x + 8, y + 26, 3, 3);
          } else {
            // Suelo (tablero de ajedrez suave)
            ctx.fillStyle = (r + c) % 2 === 0 ? COLORS.floor : COLORS.floorAlt;
            ctx.fillRect(x, y, TILE, TILE);
          }
        }
      }
    }

    function drawFruits(t) {
      for (const f of fruits) {
        const px = f.col * TILE + TILE / 2;
        const py = f.row * TILE + TILE / 2;
        const bob = Math.sin(t * 0.003 + f.anim) * 3;
        const yBob = py + bob;

        const isCovered = map[f.row][f.col] === T_ICE;

        ctx.save();

        if (isCovered) {
          // Los consumibles ocultos bajo el pasto se muestran de forma muy sutil (opacidad baja)
          ctx.globalAlpha = 0.45;
          // Efecto de movimiento sutil (respiración / vibración en espera)
          const pulse = 0.95 + Math.sin(t * 0.012 + f.anim) * 0.12;
          const shakeX = Math.cos(t * 0.025 + f.anim) * 1.2;
          const shakeY = Math.sin(t * 0.025 + f.anim) * 1.2;

          ctx.translate(px + shakeX, yBob + shakeY);
          ctx.scale(pulse, pulse);
          ctx.translate(-px, -yBob);
        }

        // Dibujar cada tipo con sus propios vectores detallados
        if (f.type === 0) {
          // 🌿 Hierba Silvestre (Green sprout)
          // Tallo
          ctx.strokeStyle = '#2d6a4f';
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(px, yBob + 8);
          ctx.quadraticCurveTo(px - 2, yBob, px - 1, yBob - 6);
          ctx.stroke();

          // Hoja Izquierda
          ctx.fillStyle = '#52b788';
          ctx.beginPath();
          ctx.moveTo(px - 1, yBob - 2);
          ctx.quadraticCurveTo(px - 12, yBob - 8, px - 10, yBob + 2);
          ctx.quadraticCurveTo(px - 4, yBob + 4, px - 1, yBob - 2);
          ctx.fill();
          ctx.strokeStyle = '#1b4332';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Hoja Derecha
          ctx.fillStyle = '#74c69d';
          ctx.beginPath();
          ctx.moveTo(px - 1, yBob - 4);
          ctx.quadraticCurveTo(px + 10, yBob - 10, px + 9, yBob - 1);
          ctx.quadraticCurveTo(px + 4, yBob + 2, px - 1, yBob - 4);
          ctx.fill();
          ctx.strokeStyle = '#1b4332';
          ctx.lineWidth = 1;
          ctx.stroke();

        } else if (f.type === 1) {
          // 🥦 Brócoli Fresco (Broccoli)
          // Tallo/Tronco
          ctx.fillStyle = '#a7c957';
          ctx.strokeStyle = '#386641';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(px - 4, yBob + 9);
          ctx.lineTo(px - 3, yBob + 1);
          ctx.lineTo(px + 3, yBob + 1);
          ctx.lineTo(px + 4, yBob + 9);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Cabezas/Ramilletes (cúpula de círculos superpuestos)
          ctx.fillStyle = '#386641';
          ctx.beginPath();
          ctx.arc(px, yBob - 3, 7, 0, Math.PI * 2);
          ctx.arc(px - 5, yBob - 1, 6, 0, Math.PI * 2);
          ctx.arc(px + 5, yBob - 1, 6, 0, Math.PI * 2);
          ctx.arc(px - 3, yBob - 6, 5, 0, Math.PI * 2);
          ctx.arc(px + 3, yBob - 6, 5, 0, Math.PI * 2);
          ctx.fill();

          // Delinear silueta exterior superior
          ctx.strokeStyle = '#1b4332';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(px - 5, yBob - 1, 6, Math.PI * 0.7, Math.PI * 1.6);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(px - 3, yBob - 6, 5, Math.PI * 1.0, Math.PI * 1.7);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(px + 3, yBob - 6, 5, Math.PI * 1.3, Math.PI * 2.0);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(px + 5, yBob - 1, 6, -Math.PI * 0.6, Math.PI * 0.3);
          ctx.stroke();

          // Pequeños puntitos de textura
          ctx.fillStyle = '#6a994e';
          ctx.fillRect(px - 3, yBob - 2, 1.2, 1.2);
          ctx.fillRect(px + 2, yBob - 4, 1.2, 1.2);
          ctx.fillRect(px, yBob - 7, 1.2, 1.2);

        } else if (f.type === 2) {
          // 🥬 Col Crujiente (Cabbage)
          // Hojas exteriores (izquierda y derecha)
          ctx.fillStyle = '#52b788';
          ctx.strokeStyle = '#1b4332';
          ctx.lineWidth = 1.5;

          // Hoja exterior izquierda
          ctx.beginPath();
          ctx.arc(px - 3, yBob + 1, 8, Math.PI * 0.5, Math.PI * 1.7);
          ctx.quadraticCurveTo(px - 2, yBob - 3, px, yBob + 1);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Hoja exterior derecha
          ctx.beginPath();
          ctx.arc(px + 3, yBob + 1, 8, -Math.PI * 0.7, Math.PI * 0.5);
          ctx.quadraticCurveTo(px + 2, yBob - 3, px, yBob + 1);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Corazón central más claro
          ctx.fillStyle = '#b7e4c7';
          ctx.beginPath();
          ctx.arc(px, yBob + 2, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Nervaduras interiores
          ctx.strokeStyle = '#d8f3dc';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(px - 1, yBob + 2, 4.5, Math.PI * 0.6, Math.PI * 1.5);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(px + 1, yBob + 2, 4.5, -Math.PI * 0.5, Math.PI * 0.4);
          ctx.stroke();

        } else if (f.type === 3) {
          // 🍎 Manzana Roja (Apple)
          // Cuerpo
          ctx.fillStyle = '#e53935';
          ctx.beginPath();
          ctx.arc(px - 4, yBob + 1, 8.5, 0, Math.PI * 2);
          ctx.arc(px + 4, yBob + 1, 8.5, 0, Math.PI * 2);
          ctx.fill();

          // Borde
          ctx.strokeStyle = '#b71c1c';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(px - 4, yBob + 1, 8.5, 0.3, Math.PI * 1.8);
          ctx.arc(px + 4, yBob + 1, 8.5, -Math.PI * 0.8, Math.PI * 0.7);
          ctx.stroke();

          // Tallo
          ctx.strokeStyle = '#5d4037';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px, yBob - 5);
          ctx.quadraticCurveTo(px + 2, yBob - 10, px + 5, yBob - 12);
          ctx.stroke();

          // Hoja
          ctx.fillStyle = '#4caf50';
          ctx.beginPath();
          ctx.ellipse(px + 3.5, yBob - 9, 3.5, 1.8, -Math.PI / 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#1b5e20';
          ctx.lineWidth = 0.8;
          ctx.stroke();

          // Brillo
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.beginPath();
          ctx.arc(px - 4, yBob - 2, 2.5, 0, Math.PI * 2);
          ctx.fill();

        } else if (f.type === 4) {
          // 🍊 Naranja Dulce (Orange)
          // Cuerpo
          ctx.fillStyle = '#ff9800';
          ctx.beginPath();
          ctx.arc(px, yBob + 1, 9.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#e65100';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Textura (puntitos)
          ctx.fillStyle = '#f57c00';
          ctx.fillRect(px - 3, yBob + 2, 1.5, 1.5);
          ctx.fillRect(px + 4, yBob - 2, 1.5, 1.5);

          // Tallo y hoja
          ctx.fillStyle = '#5d4037';
          ctx.fillRect(px - 1, yBob - 9, 2, 2);

          ctx.fillStyle = '#4caf50';
          ctx.beginPath();
          ctx.ellipse(px - 2, yBob - 9.5, 3.5, 1.8, Math.PI / 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#1b5e20';
          ctx.lineWidth = 0.8;
          ctx.stroke();

          // Brillo
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.beginPath();
          ctx.arc(px - 3, yBob - 2, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (f.type === 5) {
          // 🥦 Brócoli Dorado (Golden Broccoli Power-Up)
          // Tallo/Tronco
          ctx.fillStyle = '#ffe082';
          ctx.strokeStyle = '#ffb300';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(px - 4, yBob + 9);
          ctx.lineTo(px - 3, yBob + 1);
          ctx.lineTo(px + 3, yBob + 1);
          ctx.lineTo(px + 4, yBob + 9);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Ramilletes dorados
          ctx.fillStyle = '#ffb300';
          ctx.beginPath();
          ctx.arc(px, yBob - 3, 7, 0, Math.PI * 2);
          ctx.arc(px - 5, yBob - 1, 6, 0, Math.PI * 2);
          ctx.arc(px + 5, yBob - 1, 6, 0, Math.PI * 2);
          ctx.arc(px - 3, yBob - 6, 5, 0, Math.PI * 2);
          ctx.arc(px + 3, yBob - 6, 5, 0, Math.PI * 2);
          ctx.fill();

          // Delinear contornos superiores
          ctx.strokeStyle = '#ff6f00';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(px - 5, yBob - 1, 6, Math.PI * 0.7, Math.PI * 1.6);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(px - 3, yBob - 6, 5, Math.PI * 1.0, Math.PI * 1.7);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(px + 3, yBob - 6, 5, Math.PI * 1.3, Math.PI * 2.0);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(px + 5, yBob - 1, 6, -Math.PI * 0.6, Math.PI * 0.3);
          ctx.stroke();

          // Brillos internos
          ctx.fillStyle = '#fff9c4';
          ctx.fillRect(px - 2, yBob - 3, 1.5, 1.5);
          ctx.fillRect(px + 2, yBob - 5, 1.5, 1.5);
          ctx.fillRect(px, yBob - 7, 1.5, 1.5);
        }

        // Puntos de brillo estrella — solo para frutas visibles, dentro del save/restore
        if (!isCovered) {
          const sa = t * 0.05 + f.anim;
          ctx.strokeStyle = 'rgba(255,255,255,0.8)';
          ctx.lineWidth = 1;
          for (let i = 0; i < 4; i++) {
            const angle = sa + i * Math.PI / 2;
            const r1 = TILE * 0.32, r2 = TILE * 0.42;
            ctx.beginPath();
            ctx.moveTo(px + Math.cos(angle) * r1, py + bob + Math.sin(angle) * r1);
            ctx.lineTo(px + Math.cos(angle) * r2, py + bob + Math.sin(angle) * r2);
            ctx.stroke();
          }
        }

        ctx.restore();
      }
    }

    function drawIndicatorCell(col, row, isBreaking) {
      const fx = col * TILE + TILE / 2, fy = row * TILE + TILE / 2;
      ctx.fillStyle = isBreaking ? 'rgba(255,80,80,0.25)' : 'rgba(76,175,80,0.25)';
      ctx.fillRect(col * TILE + 2, row * TILE + 2, TILE - 4, TILE - 4);

      // Ícono de + (crear) o × (destruir)
      ctx.strokeStyle = isBreaking ? 'rgba(255,80,80,0.8)' : 'rgba(76,175,80,0.8)';
      ctx.lineWidth = 2;
      const cx = fx, cy = fy, r = 6;
      if (isBreaking) {
        ctx.beginPath(); ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.stroke();
      }
    }

    function drawPlayer(t) {
      const px = player.x, py = player.y;
      const alpha = player.invincible > 0 ? (Math.floor(player.invincible / 6) % 2 === 0 ? 0.3 : 1.0) : 1.0;
      ctx.globalAlpha = alpha;

      const dir = player.dir;

      // Colores por defecto del helado
      let bodyColor = '#7df9ff';
      let topColor = '#a0eeff';

      // Efectos visuales si tiene el buff del Brócoli Dorado activo
      if (player.goldenBroccoliTimer > 0) {
        bodyColor = '#ffd700'; // Helado de oro
        topColor = '#fff59d';  // Cima de oro brillante

        ctx.save();
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffd700';
        ctx.beginPath();
        ctx.arc(px, py, TILE * 0.58 + Math.sin(t * 0.012) * 3.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      drawIceCreamChar(px, py, dir, player.animFrame, bodyColor, topColor, t);

      // Indicadores direccionales del poder de pasto proporcional a score
      const powerCount = Math.min(4, Math.max(1, Math.floor(score / 2) + 1)); // mismo cap

      // 1. ESCANEAR PARA PODAR (Rojo) — Debe ser bloques de pasto continuos
      let currentCc = player.col + dir.x;
      let currentCr = player.row + dir.y;
      for (let i = 0; i < powerCount; i++) {
        if (currentCc <= 0 || currentCc >= COLS - 1 || currentCr <= 0 || currentCr >= ROWS - 1) break;
        if (isWall(currentCc, currentCr)) break;

        if (isIce(currentCc, currentCr)) {
          drawIndicatorCell(currentCc, currentCr, true);
        } else {
          break; // Detenerse ante espacios vacíos u otros obstáculos
        }
        currentCc += dir.x;
        currentCr += dir.y;
      }

      // 2. ESCANEAR PARA PLANTAR (Verde) — Hasta chocar con obstáculos
      currentCc = player.col + dir.x;
      currentCr = player.row + dir.y;
      for (let i = 0; i < powerCount; i++) {
        if (currentCc <= 0 || currentCc >= COLS - 1 || currentCr <= 0 || currentCr >= ROWS - 1) break;

        const hasPlayer = player.col === currentCc && player.row === currentCr;
        const hasEnemy = enemies.some(e => e.col === currentCc && e.row === currentCr);

        // Si choca con un obstáculo, detiene el preview inmediatamente
        if (isIce(currentCc, currentCr) || isWall(currentCc, currentCr) || hasPlayer || hasEnemy) {
          break;
        }

        if (isEmpty(currentCc, currentCr)) {
          drawIndicatorCell(currentCc, currentCr, false);
        }
        currentCc += dir.x;
        currentCr += dir.y;
      }

      ctx.globalAlpha = 1.0;
    }

    // Dibuja un personaje tipo Tortiland (helado con cara)
    function drawIceCreamChar(px, py, dir, frame, bodyColor, topColor, t) {
      const s = TILE * 0.38;
      const bob = Math.sin(t * 0.008 + frame) * 1;

      // Cuerpo (rectángulo redondeado)
      ctx.beginPath();
      roundRect(ctx, px - s, py - s * 0.9 + bob, s * 2, s * 1.9, 6);
      ctx.fillStyle = bodyColor;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,80,0.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Cima del helado (color diferente)
      ctx.beginPath();
      ctx.arc(px, py - s * 0.5 + bob, s * 0.75, Math.PI, 0, false);
      ctx.fillStyle = topColor;
      ctx.fill();

      // Cara — ojos
      const eyeOff = dir.x * 3;
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.arc(px - 5 + eyeOff, py - 4 + bob, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(px + 5 + eyeOff, py - 4 + bob, 3, 0, Math.PI * 2); ctx.fill();

      // Pupilas (miran en la dirección)
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(px - 5 + eyeOff + dir.x, py - 4 + bob + dir.y, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(px + 5 + eyeOff + dir.x, py - 4 + bob + dir.y, 1.2, 0, Math.PI * 2); ctx.fill();

      // Boca (animada al moverse)
      ctx.strokeStyle = '#1a1a2e';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (frame % 2 === 0) {
        ctx.arc(px + eyeOff * 0.5, py + 4 + bob, 4, 0, Math.PI, false);
      } else {
        ctx.moveTo(px - 4 + eyeOff * 0.5, py + 5 + bob); ctx.lineTo(px + 4 + eyeOff * 0.5, py + 5 + bob);
      }
      ctx.stroke();

      // Palito del helado
      ctx.fillStyle = '#d4a574';
      ctx.fillRect(px - 2, py + s * 0.8 + bob, 4, 8);
    }

    function drawEnemies(t) {
      for (const e of enemies) {
        let bodyColor, topColor;
        if (e.type === 'patrol') { bodyColor = '#ffaa33'; topColor = '#ffcc66'; }
        else if (e.type === 'chaser') { bodyColor = '#ff4466'; topColor = '#ff6688'; }
        else { bodyColor = '#cc88ff'; topColor = '#dd99ff'; }

        // Fantasma: efecto semitransparente
        if (e.type === 'ghost') ctx.globalAlpha = 0.75;

        drawIceCreamChar(e.x, e.y, e.dir, e.animFrame, bodyColor, topColor, t);

        // Etiqueta de tipo (pequeña)
        ctx.globalAlpha = 1.0;
        ctx.font = '9px monospace';
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        const label = e.type === 'patrol' ? '👁' : e.type === 'chaser' ? '🎯' : '👻';
        ctx.fillText(label, e.x - 6, e.y - TILE * 0.55);
      }
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
    }

    // Efecto de partículas de hielo al crear/destruir (simple)
    let particles = [];
    function spawnParticles(col, row, color) {
      const cx = col * TILE + TILE / 2, cy = row * TILE + TILE / 2;
      for (let i = 0; i < 8; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 3;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
          life: 30, maxLife: 30,
          color,
        });
      }
    }
    function updateDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1.0;
    }

    // Guardar el estado previo del mapa para detectar cambios y spawnear partículas
    let prevMap = null;
    function detectMapChanges() {
      if (!prevMap) { prevMap = map.map(r => [...r]); return; }
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (prevMap[r][c] !== map[r][c]) {
            if (map[r][c] === T_ICE) spawnParticles(c, r, '#81c784');
            else if (prevMap[r][c] === T_ICE) spawnParticles(c, r, '#a7c957');
          }
        }
      }
      prevMap = map.map(r => [...r]);
    }

    // ============================================================
    // UI
    // ============================================================
    function updateUI() {
      document.getElementById('collectiblesDisplay').textContent = score;
      document.getElementById('scoreDisplay').textContent = score * 100;
      document.getElementById('livesDisplay').textContent = lives;
      document.getElementById('levelDisplay').textContent = level;
      document.getElementById('timerDisplay').textContent = formatTime(gameTimeElapsed);
      updateAppleProgress();
    }

    function updateAppleProgress() {
      const progressEl = document.getElementById('applesDisplay');
      if (!progressEl || !fruits) return;

      if (levelPhase === 'apples') {
        const applesRemaining = fruits.filter(f => f.type === 3).length;
        const applesEaten = Math.max(0, Math.min(5, 5 - applesRemaining));
        let html = '';
        for (let i = 0; i < 5; i++) {
          if (i < applesEaten) {
            html += '<span style="color: #4caf50; filter: drop-shadow(0 0 2px #4caf50);">✅</span> ';
          } else {
            html += '🍎 ';
          }
        }
        document.getElementById('applesProgress').innerHTML = `🍎 Manzanas: ${html}`;
      } else if (levelPhase === 'oranges') {
        const orangesRemaining = fruits.filter(f => f.type === 4).length;
        const orangesEaten = Math.max(0, Math.min(5, 5 - orangesRemaining));
        let html = '';
        for (let i = 0; i < 5; i++) {
          if (i < orangesEaten) {
            html += '<span style="color: #4caf50; filter: drop-shadow(0 0 2px #4caf50);">✅</span> ';
          } else {
            html += '🍊 ';
          }
        }
        document.getElementById('applesProgress').innerHTML = `🍊 Naranjas: ${html}`;
      }
    }

    function showOverlay(title, msg, btnText) {
      const ov = document.getElementById('overlay');
      document.getElementById('overlayTitle').textContent = title;
      document.getElementById('overlayMsg').textContent = msg;
      document.getElementById('overlayBtn').textContent = btnText;
      ov.classList.remove('hidden');
    }
    function hideOverlay() {
      document.getElementById('overlay').classList.add('hidden');
    }

    document.getElementById('overlayBtn').addEventListener('click', () => {
      if (gameState === 'gameover' || gameState === 'win') {
        score = 0; lives = 3; level = 1; levelPhase = 'apples'; updateUI();
      }
      initLevel();
      hideOverlay();
      gameState = 'playing';
      particles = [];
      prevMap = null;
    });

    canvas.addEventListener('click', () => {
      if (gameState === 'playing') {
        isPaused = !isPaused;
      }
    });

    // ============================================================
    // BUCLE PRINCIPAL
    // ============================================================
    let lastTime = 0;
    function gameLoop(timestamp) {
      const dt = timestamp - lastTime;
      lastTime = timestamp;

      ctx.clearRect(0, 0, W, H);

      if (gameState === 'playing') {
        if (!isPaused) {
          updatePlayer(dt);
          enemies.forEach(e => updateEnemy(e));
          checkPlayerEnemyCollision();
          detectMapChanges();

          gameTimeElapsed += dt;
          document.getElementById('timerDisplay').textContent = formatTime(gameTimeElapsed);
        }
      }

      // Render
      drawMap();
      updateDrawParticles();
      drawFruits(timestamp);

      if (gameState === 'playing' || gameState === 'dead' || gameState === 'win') {
        drawPlayer(timestamp);
        drawEnemies(timestamp);
      }

      // HUD — indicador de vidas y estados visuales
      if (gameState === 'playing') {
        ctx.font = 'bold 12px monospace';
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(4, 4, 196, 58);

        ctx.fillStyle = '#81c784';
        ctx.fillText('🌱 [Espacio] Plantar pasto', 8, 17);
        ctx.fillStyle = '#ff8080';
        ctx.fillText('🧹 [Tab] Quitar pasto', 8, 33);

        // Mostrar estado del Brócoli Dorado
        if (player.goldenBroccoliTimer > 0) {
          ctx.fillStyle = '#ffd700';
          const secs = Math.ceil(player.goldenBroccoliTimer / 60);
          ctx.fillText(`🥦 Dorado: ${secs}s`, 8, 51);
        } else {
          ctx.fillStyle = '#aaa';
          ctx.fillText('🥦 Sin Brócoli Dorado', 8, 51);
        }
      }

      // Pantalla de Pausa
      if (gameState === 'playing' && isPaused) {
        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(0, 0, W, H);

        // Texto principal PAUSA
        ctx.font = 'bold 40px \'Courier New\', monospace';
        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffd700';
        ctx.fillText('⏸️ JUEGO PAUSADO', W / 2, H / 2 - 20);

        // Subtexto indicativo
        ctx.font = 'bold 16px \'Courier New\', monospace';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 0;
        ctx.fillText('Haz clic de nuevo para reanudar', W / 2, H / 2 + 30);
        ctx.restore();
      }

      requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // ARRANQUE
    // ============================================================
    initLevel();
    updateUI();
    requestAnimationFrame(gameLoop);
  </script>
</body>
